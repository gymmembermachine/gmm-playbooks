<title>Bring Your Boo Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17130f;
    --ink-2: #4a423a;
    --ink-3: #847a70;
    --paper: #fbf7f1;
    --card: #ffffff;
    --line: #e8dfd3;
    --orange: #ee6a1f;
    --orange-deep: #c9500f;
    --orange-tint: #fdeee3;
    --night: #1d1726;
    --night-2: #2c2338;
    --green: #2f7d4f;
    --green-tint: #e6f3ea;
    --red: #b3372b;
    --red-tint: #fbe9e6;
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.6 Inter, system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  h1, h2, h3 { font-family: "Archivo Black", Inter, sans-serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.1; }
  h2 { font-size: 34px; margin: 0 0 6px; text-transform: uppercase; }
  h3 { font-size: 19px; margin: 28px 0 10px; }
  h4 { font: 800 12px/1.3 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-deep); margin: 26px 0 10px; }
  p { margin: 0 0 12px; }
  ul, ol { margin: 0 0 14px; padding-left: 20px; }
  li { margin-bottom: 6px; }
  li::marker { color: var(--orange); font-weight: 700; }
  strong { font-weight: 700; }
  em { color: var(--ink-2); }

  /* ---------- Cover ---------- */
  .cover {
    page: cover;
    background: var(--night);
    color: #fff;
    position: relative;
    overflow: hidden;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 56px 48px;
  }
  .cover::before {
    content: ""; position: absolute; right: -180px; top: -140px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ff8a3d 0%, var(--orange) 45%, #a33d06 100%);
    opacity: .95;
  }
  .cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 110%, rgba(238,106,31,.25), transparent 60%);
  }
  .cover > * { position: relative; z-index: 1; }
  .brand { font: 800 12px/1 Inter, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #fff; opacity: .85; }
  .cover .ghost { font-size: 88px; line-height: 1; margin-bottom: 18px; }
  .cover h1 { font-size: 92px; line-height: .92; margin: 0 0 18px; text-transform: uppercase; }
  .cover h1 span { color: var(--orange); }
  .cover .sub { font: 600 22px/1.35 Inter, sans-serif; max-width: 520px; color: #eee3d8; margin-bottom: 28px; }
  .cover .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { border: 1px solid rgba(255,255,255,.28); border-radius: 99px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: #fff; }
  .cover .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 13px; color: #cbbfd6; gap: 24px; }

  /* ---------- Sections ---------- */
  section { padding: 56px 0 8px; }
  .kicker { font: 800 12px/1 Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .kicker b { background: var(--orange); color: #fff; border-radius: 4px; padding: 4px 7px; letter-spacing: .08em; }
  .lede { font-size: 17px; color: var(--ink-2); max-width: 680px; margin-bottom: 22px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; break-inside: avoid; }
  .card > :last-child { margin-bottom: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-2 > .card, .grid-3 > .card { margin-bottom: 0; }
  .stack { display: grid; gap: 14px; margin-bottom: 14px; }

  .num { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff; font: 800 14px/1 Inter, sans-serif; margin-bottom: 10px; }
  .card h3 { margin-top: 0; }
  .rec { background: var(--orange-tint); border-left: 4px solid var(--orange); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 12px 0; break-inside: avoid; }
  .rec .tag { font: 800 11px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-deep); display: block; margin-bottom: 6px; }
  .rec > :last-child { margin-bottom: 0; }

  .callout-dark { background: var(--night); color: #f3ebe3; border-radius: 14px; padding: 22px 24px; margin: 18px 0; break-inside: avoid; }
  .callout-dark strong { color: #fff; }
  .callout-dark .tag { font: 800 11px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); display: block; margin-bottom: 8px; }

  .levers { counter-reset: lever; }
  .levers .card { position: relative; padding-top: 22px; }
  .levers .card::before { counter-increment: lever; content: counter(lever); font-family: "Archivo Black", sans-serif; font-size: 44px; color: var(--orange); line-height: 1; display: block; margin-bottom: 8px; }

  /* scripts */
  .script { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--night); border-radius: 0 12px 12px 0; padding: 16px 20px; margin: 10px 0 16px; font-size: 15px; break-inside: avoid; }
  .script .who { font: 800 11px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 8px; }
  .script p:last-child { margin-bottom: 0; }
  .say { font-style: normal; color: var(--ink); }
  .blank { background: #fff4d6; border-radius: 4px; padding: 0 5px; font-weight: 600; color: #7a5200; white-space: nowrap; }
  .stage { color: var(--ink-3); font-style: italic; }

  /* timeline */
  .timeline { position: relative; margin: 8px 0 18px; padding-left: 0; list-style: none; }
  .timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px dashed var(--line); margin: 0; break-inside: avoid; }
  .timeline li:last-child { border-bottom: 0; }
  .timeline .d { font: 800 14px/1.3 Inter, sans-serif; color: var(--ink); }
  .timeline .d small { display: block; font-weight: 600; color: var(--ink-3); font-size: 12px; }
  .timeline li.go { background: var(--orange-tint); border-radius: 10px; padding: 12px 12px; border-bottom: 0; margin: 4px 0; }
  .timeline li.go .d { color: var(--orange-deep); }

  /* messages */
  .msg { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin: 0 0 16px; overflow: hidden; break-inside: avoid; }
  .msg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 18px; background: #f6efe6; border-bottom: 1px solid var(--line); }
  .msg-head .type { font: 800 12px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .msg-head .when { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .msg-head .type i { font-style: normal; display: inline-block; border-radius: 4px; padding: 3px 6px; margin-right: 8px; color: #fff; background: var(--night); letter-spacing: .08em; }
  .msg-head .type i.sms { background: var(--green); }
  .msg-head .type i.post { background: var(--orange); }
  .msg-body { padding: 16px 18px; font-size: 14.5px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .subject { font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .subject span { color: var(--ink-3); font-weight: 600; margin-right: 6px; }
  .mt { font: 500 12.5px/1 "JetBrains Mono", ui-monospace, monospace; background: #efe9f7; color: #4b2f7a; border-radius: 4px; padding: 2px 5px; white-space: nowrap; }
  .note { font-size: 13px; color: var(--ink-2); background: #f3ede5; border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }

  /* tables */
  table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 8px 0 18px; font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th { text-align: left; font: 800 11px/1.2 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); background: #f6efe6; padding: 11px 14px; }
  td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  tr { break-inside: avoid; }
  td:first-child { font-weight: 700; }
  .target { font-family: "Archivo Black", sans-serif; color: var(--orange-deep); white-space: nowrap; }

  /* checklist */
  .check { list-style: none; padding: 0; }
  .check li { position: relative; padding-left: 30px; margin-bottom: 9px; break-inside: avoid; }
  .check li::before { content: ""; position: absolute; left: 0; top: 3px; width: 17px; height: 17px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; }
  .check ul { margin-top: 8px; }
  /* interactive checklist (JS adds .live) */
  .check.live li { cursor: pointer; border-radius: 6px; transition: background .12s; }
  .check.live li:hover { background: var(--orange-tint); }
  .check.live li::before { display: none; }
  .check.live li > input.cb { position: absolute; left: 0; top: 2px; width: 19px; height: 19px; margin: 0; accent-color: var(--green); cursor: pointer; }
  .check.live li.done > .txt { color: var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.3); }
  .progress { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 4px 0 8px; font-size: 13.5px; }
  .progress .bar { flex: 1 1 160px; height: 8px; background: #efe7dc; border-radius: 99px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .2s; }
  .progress b { font-variant-numeric: tabular-nums; }
  .progress small { color: var(--ink-3); flex-basis: 100%; }
  .progress button { font: 700 12px/1 Inter, sans-serif; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
  .progress button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .progress .bar i, .check.live li { transition: none; } }
  .phase { display: inline-block; font: 800 12px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; background: var(--night); color: #fff; border-radius: 6px; padding: 7px 11px; margin: 18px 0 12px; }

  /* close steps */
  .steps { list-style: none; padding: 0; counter-reset: step; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 38px 1fr; gap: 12px; margin-bottom: 12px; break-inside: avoid; }
  .steps li::before { content: counter(step); width: 30px; height: 30px; border-radius: 50%; background: var(--night); color: #fff; display: flex; align-items: center; justify-content: center; font: 800 13px/1 Inter, sans-serif; }

  /* flow */
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 16px; }
  .flow span { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .flow b { color: var(--orange); }

  /* printable pages */
  .printable { background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 28px 30px; margin: 10px 0 18px; }
  .printable h2 { font-size: 30px; }
  .fill { display: grid; grid-template-columns: 1fr; gap: 0; margin: 14px 0 18px; }
  .fill div { display: grid; grid-template-columns: 210px 1fr; gap: 12px; align-items: end; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .fill div label { font-weight: 700; }
  
  .signup { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .slot { border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; break-inside: avoid; }
  .slot header { background: var(--night); color: #fff; padding: 9px 14px; font: 800 13px/1 Inter, sans-serif; display: flex; justify-content: space-between; }
  .slot header span:last-child { color: var(--orange); }
  .slot .row { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); height: 34px; }
  .slot .row.h { height: auto; background: #f6efe6; font: 800 10px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .slot .row > div { padding: 8px 12px; }
  .slot .row > div + div { border-left: 1px solid var(--line); }

  .toc { columns: 2; column-gap: 36px; list-style: none; padding: 0; margin: 20px 0 0; }
  .toc li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); break-inside: avoid; margin: 0; font-weight: 600; }
  .toc li span { font-family: "Archivo Black", sans-serif; color: var(--orange); width: 24px; }
  .toc a { color: inherit; text-decoration: none; }

  h3.big { font-size: 26px; margin: 40px 0 12px; padding-top: 24px; border-top: 2px solid var(--line); }
  .warn { background: #fff4d6; border: 1px solid #efd48a; border-radius: 10px; padding: 11px 14px; margin: 0 0 14px; font-size: 14.5px; }
  .mode { display: inline-block; font: 800 10px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; border-radius: 4px; padding: 4px 6px; margin-left: 8px; vertical-align: 1px; }
  .mode.hand { background: #fff4d6; color: #7a5200; }
  .mode.auto { background: #efe9f7; color: #4b2f7a; }
  .copy-btn { font: 700 12px/1 Inter, sans-serif; border: 1px solid var(--ink); background: #fff; color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .copy-btn:hover { background: var(--ink); color: #fff; }
  .copy-btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .copy-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
  .msg-head .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  /* sign-up sheet (printable) */
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .sheet-top .dayline { font: 800 15px/1 Inter, sans-serif; }
  .sheet-top .dayline span { display: inline-block; width: 190px; border-bottom: 1.5px solid var(--ink); margin-left: 6px; }
  .sheet-how { font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px; }
  .sess { border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 10px; break-inside: avoid; }
  .sess-h { background: var(--night); color: #fff; display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; font: 700 12.5px/1.2 Inter, sans-serif; flex-wrap: wrap; }
  .sess-h span b { display: inline-block; width: 90px; border-bottom: 1px solid rgba(255,255,255,.7); margin-left: 4px; }
  .sess-h span b.sm { width: 34px; }
  .sess table { border: 0; border-radius: 0; margin: 0; font-size: 12px; table-layout: fixed; }
  .sess th { padding: 4px 8px; font-size: 9.5px; text-align: left; }
  .sess th.c, .sess td.c { text-align: center; width: 11%; }
  .sess td { height: 24px; padding: 0 8px; border-top: 1px solid var(--line); }
  .sess td + td, .sess th + th { border-left: 1px solid var(--line); }
  .sess td.c::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--ink-3); border-radius: 3px; vertical-align: middle; }
  a.res { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; color: inherit; text-decoration: none; border-color: var(--orange); }
  a.res:hover { background: var(--orange-tint); }
  a.res:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .res-go { font: 800 13px/1 Inter, sans-serif; color: var(--orange-deep); white-space: nowrap; }
  .fillin { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; padding: 2px 4px; width: 100%; min-width: 0; }
  .fillin:focus { outline: none; background: #fff4d6; }
  .fillin.inline { width: 220px; max-width: 100%; font-weight: 700; }
  .sess-h .fillin { color: #fff; border-bottom-color: rgba(255,255,255,.7); width: 110px; font-weight: 700; }
  .sess-h .fillin.sm { width: 44px; }
  .sess-h .fillin:focus { background: rgba(255,255,255,.12); }
  .print-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--night); color: #f3ebe3; border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; font-size: 13.5px; }
  .print-bar span { flex: 1 1 260px; }
  .print-bar button { font: 800 13px/1 Inter, sans-serif; background: var(--orange); color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .print-bar button:hover { background: var(--orange-deep); }
  .print-bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .print-bar .ghost-btn { background: transparent; border: 1px solid rgba(255,255,255,.4); }
  .ps { font-size: 15px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
  .end { text-align: center; padding: 60px 0 70px; color: var(--ink-3); font-size: 13px; }
  .end .ghost { font-size: 44px; }

  @media (max-width: 720px) {
    body { font-size: 15px; }
    .wrap { padding: 0 16px; }
    .cover { padding: 40px 24px 32px; min-height: 520px; }
    .cover::before { width: 360px; height: 360px; right: -140px; top: -100px; }
    .cover h1 { font-size: 56px; }
    .cover .ghost { font-size: 60px; }
    .cover .sub { font-size: 18px; }
    .cover .foot { flex-direction: column; align-items: flex-start; }
    h2 { font-size: 27px; }
    .grid-2, .grid-3, .signup { grid-template-columns: 1fr; }
    .toc { columns: 1; }
    .timeline li { grid-template-columns: 72px 1fr; gap: 10px; }
    .fill div { grid-template-columns: 1fr; gap: 4px; }
    .printable { padding: 20px 16px; }
    .mt { white-space: normal; word-break: break-all; }
  }

  /* ---------- Print ---------- */
  @page { size: Letter; margin: 0.6in 0.65in 0.7in; @bottom-center { content: "Bring Your Boo  ·  Gym Member Machine  ·  " counter(page); font: 600 9px Inter, sans-serif; color: #847a70; letter-spacing: .08em; } }
  @page cover { margin: 0; @bottom-center { content: none; } }
  @media print {
    body { background: #fff; font-size: 11pt; }
    .wrap { max-width: none; padding: 0; }
    .cover { height: 11in; min-height: 0; padding: 0.8in 0.75in 0.7in; }
    section { padding: 0; }
    section.pb { break-before: page; }
    .timeline li { padding: 6px 0; }
    .timeline li.go { padding: 8px 10px; }
    .lede { margin-bottom: 14px; }
    td, th { padding: 8px 12px; }
    .check li { margin-bottom: 6px; }
    .phase { margin: 12px 0 8px; }
    #checklist .grid-2 .card { padding: 12px 16px; }
    .card, .msg, .script, .rec, .callout-dark, .slot, table { box-shadow: none; }
    .card, .msg, table { background: #fff; }
    h2, h3, h4, .kicker, .phase { break-after: avoid; }
    .printable { break-before: page; border: 0; padding: 0; margin: 0; }
    .end { display: none; }
    .copy-btn, .print-bar, .progress { display: none !important; }
    .check.live li:hover { background: none; }
    body.print-one > .cover, body.print-one main > * { display: none !important; }
    body.print-one.print-cheat main > #cheat, body.print-one.print-signup main > #signup { display: block !important; }
    body.print-one main > section.pb, body.print-one .printable { break-before: auto; }
    #cheat .fill div { padding: 8px 0; }
    #cheat .fill { margin: 8px 0 12px; }
    #cheat h4 { margin: 16px 0 8px; }
    h3.big { break-before: page; border-top: 0; padding-top: 0; margin-top: 0; }
    #signup .printable { padding-top: 0; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
